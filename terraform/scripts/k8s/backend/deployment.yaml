apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default

data:
  DB_HOST: "host.minikube.internal"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
  labels:
    app: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      # Mapeia host.minikube.internal diretamente para o IP do Host
      hostAliases:
        - ip: "${HOST_IP}"
          hostnames:
            - "host.minikube.internal"

      containers:
        - name: backend-container
          image: higorsantanafiec/helptech-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: firebase-secret
                  key: FIREBASE_CREDENTIALS_JSON

          volumeMounts:
            - name: firebase-key-volume
              mountPath: /tmp/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true

      volumes:
        - name: firebase-key-volume
          secret:
            secretName: firebase-secret
            items:
              - key: FIREBASE_CREDENTIALS_JSON
                path: serviceAccountKey.json

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default

spec:
  type: NodePort

  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080